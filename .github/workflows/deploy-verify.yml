name: Verify Production & Auto-Rollback

# After every merge to main, Render auto-deploys. This workflow then checks that
# production is actually live. If it is -> keep the change. If it stays down ->
# automatically `git revert` the merge, which redeploys the last good version.
on:
  push:
    branches: [ "main" ]

# The revert step pushes a commit back to main, so the job needs write access.
permissions:
  contents: write

# Never run two verifications at once (a revert push would fight a new deploy).
concurrency:
  group: deploy-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Health-check production, revert on failure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Don't try to roll back a rollback (prevents an infinite revert loop).
      # Skip when the latest commit is itself a revert or is tagged [skip-rollback].
      - name: Decide whether to verify
        id: guard
        run: |
          MSG="$(git log -1 --pretty=%s)"
          echo "Latest commit: $MSG"
          if echo "$MSG" | grep -qiE 'revert|\[skip-rollback\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Render doesn't tell GitHub when it finished, so give the new deploy a head
      # start before we start polling. Free-tier builds can take a few minutes.
      - name: Wait for Render to start the new deploy
        if: steps.guard.outputs.skip == 'false'
        run: sleep 120

      # Poll the production health endpoint (/ask returns 200 when the app is up).
      # Retry for ~10 minutes to absorb slow free-tier builds and cold starts.
      - name: Health-check production
        if: steps.guard.outputs.skip == 'false'
        id: health
        run: |
          BASE="${{ vars.PROD_URL || 'https://kr7.onrender.com' }}"
          URL="$BASE/ask"
          echo "Checking $URL"
          healthy=false
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then healthy=true; break; fi
            sleep 15
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"

      # Production is down after the deploy: revert the offending commit and push.
      # That push (a revert) redeploys the previous working version and, thanks to
      # the guard above, will NOT be rolled back itself.
      - name: Auto-revert failed deploy
        if: steps.guard.outputs.skip == 'false' && steps.health.outputs.healthy == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA="${{ github.sha }}"
          PARENTS=$(git rev-list --parents -n 1 "$SHA" | wc -w)
          echo "Reverting $SHA (parents field count: $PARENTS)"
          if [ "$PARENTS" -gt 2 ]; then
            # Merge commit: revert relative to the mainline (first) parent.
            git revert --no-edit -m 1 "$SHA"
          else
            git revert --no-edit "$SHA"
          fi
          git push origin HEAD:main

      # Make the run RED so you get notified that a rollback happened.
      - name: Report rollback
        if: steps.guard.outputs.skip == 'false' && steps.health.outputs.healthy == 'false'
        run: |
          echo "::error::Production was unhealthy after deploying ${{ github.sha }}. Reverted it."
          exit 1

      - name: Report success
        if: steps.guard.outputs.skip == 'false' && steps.health.outputs.healthy == 'true'
        run: echo "Production is live. Keeping ${{ github.sha }}."
